[project]
name = "jarvis"
version = "1.0.0"
description = "Local-first AI assistant mesh -- Personal AI Assistant, Local-first, Privacy-first"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "llama-cpp-python>=0.2.90",
    "mcp>=1.2.0",
    "pvporcupine>=3.0.2",
    "sounddevice>=0.4.7",
    "numpy>=1.26.0",
    "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
jarvis = "jarvis.main:run"
jarvis-mcp = "jarvis.mcp.server:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_py"]
