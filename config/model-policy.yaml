routing:
  escalate_tags:
    - "multi_step_reasoning"
    - "long_tool_plan"
  hard_keywords:
    - "multi-step"
    - "full design"
    - "long plan"
    - "refactor large file"
    - "architect"
    - "comprehensive"
    - "detailed analysis"
    - "compare multiple"
    - "research"
    - "write a report"
    - "create a document"
    - "plan a project"
  default_class: "normal"

# Difficulty tier -> Claude model. Router.classify() (jarvis/router/router.py)
# picks the tier from the request text; EngineSelector dispatches to the
# matching model here. No local weights, no load/evict scheduling -- Anthropic
# hosts all three.
models:
  router:
    id: "claude-haiku-4-5"
    max_tokens: 512
    temperature: 0.3

  primary:
    id: "claude-sonnet-5"
    max_tokens: 2048
    temperature: 0.5

  heavy:
    id: "claude-opus-5"
    max_tokens: 4096
    temperature: 0.5

policy:
  mode: "dev"
  fallback_enabled: true
  log_routing_decisions: true
